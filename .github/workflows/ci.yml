name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of each other,
  # and a filter on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel so the wall clock is the slower of them, not the sum:
# `pnpm run checks` covers the static checks and the backend suite (which
# builds once and boots a real DMS), and verify-source builds a whole
# generated Inertia app. `ubuntu` gathers them under the name the branch
# protection knows.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
      windows: true
      # The modules `ajs module test` downloads and installs. The harness
      # names each by exact version, so a restored copy of another version
      # is downloaded again.
      cache-paths: .antelope/cache
    permissions:
      contents: read

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # Before setup-node: its pnpm cache resolves the store by running pnpm.
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # frontend-vue retains its own lockfile; without it
          # the cache key ignores half of what the job installs.
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      # The root install provides the DMS layer verify-source builds against.
      - run: pnpm install --frozen-lockfile
      # Builds and type-checks the module inside a generated Inertia app with
      # the DMS core layer; it needs neither the module's dist nor a database.
      - run: pnpm test:frontend

  formal-table-watch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # vitest over the Vue module's helpers, composables and registration,
      # here rather than in `frontend`, the longest job.
      - run: pnpm test:layer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/formal-table-watch/check.mjs

  # The job name the branch protection requires; it passes only when every
  # job above passed.
  ubuntu:
    if: always()
    needs: [ci, frontend, formal-table-watch]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
