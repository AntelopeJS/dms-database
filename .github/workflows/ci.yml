name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel so the wall clock is the slower of them, not the sum:
# `pnpm run checks` covers the static checks and the backend suite (which
# builds once and boots a real DMS), and verify-source builds a whole
# generated Inertia app. `ubuntu` gathers them under the name the branch
# protection knows.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
      # The modules `ajs module test` downloads and installs. The harness
      # names each by exact version, so a restored copy of another version
      # is downloaded again.
      cache-paths: .antelope/cache
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: tests on a ready pull request that touches more than docs,
  # on a push to next and in the nightly, Windows in the nightly only.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      tests: ${{ steps.tier.outputs.tests }}
      os: ${{ steps.tier.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          case "$EVENT" in
            pull_request)
              if [[ "$BASE_REF" == "$DEFAULT_BRANCH" && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" =~ ^(next|develop)$ ]]; then
                tier=none
              elif [[ "$DRAFT" == true ]]; then
                tier=draft
              elif [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
                tier=full
              else
                tier=fast
              fi
              ;;
            push)
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then tier=none; else tier=full; fi
              ;;
            schedule) tier=nightly ;;
            *) tier=full ;;
          esac

          tests=true
          case "$tier" in
            none | draft) tests=false ;;
            fast)
              tests=false
              while IFS= read -r file; do
                case "$file" in
                  README.md | docs/*) ;;
                  *) tests=true ;;
                esac
              done < <(git diff --name-only --no-renames HEAD^1 HEAD)
              ;;
          esac

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          {
            echo "tier=${tier}"
            echo "tests=${tests}"
            echo "os=${os}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: tests ${tests}, runners ${os}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: select
    if: needs.select.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # Before setup-node: its pnpm cache resolves the store by running pnpm.
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # frontend-vue retains its own lockfile; without it
          # the cache key ignores half of what the job installs.
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      # The root install provides the DMS layer verify-source builds against.
      - run: pnpm install --frozen-lockfile
      # Builds and type-checks the module inside a generated Inertia app with
      # the DMS core layer; it needs neither the module's dist nor a database.
      - run: pnpm test:frontend

  formal-table-watch:
    needs: select
    if: needs.select.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # vitest over the Vue module's helpers, composables and registration,
      # here rather than in `frontend`, the longest job.
      - run: pnpm test:layer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/formal-table-watch/check.mjs

  # The Playwright suite in `e2e/`: the journeys tagged @smoke on the full
  # tier, every journey in two shards on the nightly tier, nothing on a draft
  # or the fast tier. One worker owns a MongoDB replica set, the backend and
  # the dashboard on free ports.
  e2e:
    needs: select
    if: needs.select.outputs.tier == 'full' || needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.tier == 'nightly' && '[1, 2]' || '[1]') }}
    env:
      TIER: ${{ needs.select.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      # The playground's modules, the dashboard's workspace installs, the
      # mongod binary and Chromium.
      - uses: actions/cache@v4
        with:
          path: |
            e2e/playground/.antelope/cache
            ~/.antelopejs/dms-frontend
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/playground/antelope.config.ts', 'e2e/playground/antelope-lock/**', 'e2e/stack.ts', 'pnpm-lock.yaml', 'frontend-vue/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install (the package mirrors of the runner did not answer): installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:build
      - if: env.TIER == 'full'
        run: pnpm e2e:run --grep @smoke
      # The blob report keeps each test's steps, attachments and traces, so
      # e2e-report merges the shards into one.
      - if: env.TIER == 'nightly'
        run: pnpm e2e:run --shard=${{ matrix.shard }}/2 --reporter=blob
      - if: always() && env.TIER == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure() && env.TIER == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # One HTML and JSON report of the nightly shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The job name the branch protection requires; it passes only when every
  # job above passed or the tier skipped it. A draft pull request fails it, so
  # merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, frontend, formal-table-watch, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.tests == 'true' && (needs.frontend.result == 'skipped' || needs.formal-table-watch.result == 'skipped')) || ((needs.select.outputs.tier == 'full' || needs.select.outputs.tier == 'nightly') && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
