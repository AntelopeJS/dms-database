name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel so the wall clock is the slower of them, not the sum:
# `pnpm run checks` covers the static checks and the backend suite (which
# builds once and boots a real DMS), and verify-source builds a whole
# generated Inertia app. `ubuntu` gathers them under the name the branch
# protection knows.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
      # The modules `ajs module test` downloads and installs. The harness
      # names each by exact version, so a restored copy of another version
      # is downloaded again.
      cache-paths: .antelope/cache
      module-locks: true
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so the jobs declared here select by the
  # shared tier rule: tests on a ready pull request that touches more than docs,
  # on a push, in the merge queue and in the nightly, Windows in the nightly only.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      tests: ${{ steps.tier.outputs.tests }}
      os: ${{ steps.tier.outputs.os }}
      e2e: ${{ steps.tier.outputs.e2e }}
      shards: ${{ steps.tier.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          TIER: ${{ steps.pick.outputs.tier }}
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          tier="$TIER"

          tests=true
          case "$tier" in
            none | draft) tests=false ;;
            fast)
              tests=false
              while IFS= read -r file; do
                case "$file" in
                  README.md | docs/*) ;;
                  *) tests=true ;;
                esac
              done < <(git diff --name-only --no-renames HEAD^1 HEAD)
              ;;
          esac

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          e2e=none
          shards='[1]'
          if [[ "$tests" == true ]]; then
            if [[ "$EVENT" == pull_request && "$FULL_LABEL" != true ]]; then
              e2e=smoke
            else
              e2e=all
              shards='[1, 2]'
            fi
          fi

          {
            echo "tier=${tier}"
            echo "tests=${tests}"
            echo "os=${os}"
            echo "e2e=${e2e}"
            echo "shards=${shards}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: tests ${tests}, runners ${os}, e2e ${e2e} on ${shards}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: select
    if: needs.select.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Before setup-node: its pnpm cache resolves the store by running pnpm.
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # frontend-vue retains its own lockfile; without it
          # the cache key ignores half of what the job installs.
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      # The root install provides the DMS layer verify-source builds against.
      - run: pnpm install --frozen-lockfile
      # Builds and type-checks the module inside a generated Inertia app with
      # the DMS core layer; it needs neither the module's dist nor a database.
      - run: pnpm test:frontend

  formal-table-watch:
    needs: select
    if: needs.select.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # vitest over the Vue module's helpers, composables and registration,
      # here rather than in `frontend`, the longest job.
      - run: pnpm test:layer
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/formal-table-watch/check.mjs

  # The Playwright suite in `e2e/`: the journeys tagged @smoke on a pull
  # request, every journey in two shards in the merge queue, the nightly, a
  # manual run and a pull request labelled ci:full, nothing on a draft or a
  # docs-only change. One worker owns a MongoDB replica set, the backend and
  # the dashboard on free ports.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      SUITE: ${{ needs.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      # The playground's modules, the dashboard's workspace installs, the
      # mongod binary and Chromium.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e2e/playground/.antelope/cache
            ~/.antelopejs/dms-frontend
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/playground/antelope.config.ts', 'e2e/playground/antelope-lock/**', 'e2e/stack.ts', 'pnpm-lock.yaml', 'frontend-vue/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install (the package mirrors of the runner did not answer): installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:build
      - if: env.SUITE == 'smoke'
        run: pnpm e2e:run --grep @smoke
      # The blob report keeps each test's steps, attachments and traces, so
      # e2e-report merges the shards into one.
      - if: env.SUITE == 'all'
        run: pnpm e2e:run --shard=${{ matrix.shard }}/2 --reporter=blob,list
      - if: ${{ !cancelled() }}
        uses: AntelopeJS/.github/.github/actions/module-locks-committed@v2
      - if: always() && env.SUITE == 'all'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure() && env.SUITE == 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # One HTML and JSON report of the shards of a whole-suite run.
  e2e-report:
    needs: [select, e2e]
    if: always() && !cancelled() && needs.select.outputs.e2e == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The job name the branch protection requires; it passes only when every
  # job above passed or the tier skipped it. A draft pull request fails it, so
  # merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, frontend, formal-table-watch, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.tests == 'true' && (needs.frontend.result == 'skipped' || needs.formal-table-watch.result == 'skipped')) || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  module-locks:
    needs: [ci, e2e]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
